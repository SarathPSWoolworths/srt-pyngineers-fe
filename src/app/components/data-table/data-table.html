<div class="cyber-table-page">
  <!-- Animated Background Grid -->
  <div class="grid-bg"></div>

  <!-- Header -->
  <header class="page-header">
    <button class="cyber-btn back-btn" (click)="goBack()">
      <span class="btn-text">&lt; BACK TO MATRIX</span>
      <span class="btn-glitch"></span>
    </button>
    <h1 class="page-title">NEURAL NETWORK DATA</h1>
    <p class="page-subtitle">// SYSTEM MONITORING INTERFACE v2.0</p>
  </header>

  <!-- Table Container -->
  <div class="table-container">
    <div class="table-glow"></div>
    <table mat-table [dataSource]="dataSource" class="cyber-table">
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>NODE_ID</th>
        <td mat-cell *matCellDef="let element" class="id-cell">{{ element.id }}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>PROTOCOL_NAME</th>
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>STATUS</th>
        <td mat-cell *matCellDef="let element">
          <span class="status-badge" [ngClass]="getStatusClass(element.status)">
            {{ element.status }}
          </span>
        </td>
      </ng-container>

      <!-- Threat Column -->
      <ng-container matColumnDef="threat">
        <th mat-header-cell *matHeaderCellDef>THREAT_LEVEL</th>
        <td mat-cell *matCellDef="let element">
          <span class="threat-badge" [ngClass]="getThreatClass(element.threat)">
            {{ element.threat }}
          </span>
        </td>
      </ng-container>

      <!-- Last Active Column -->
      <ng-container matColumnDef="lastActive">
        <th mat-header-cell *matHeaderCellDef>LAST_SYNC</th>
        <td mat-cell *matCellDef="let element" class="timestamp-cell">{{ element.lastActive }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <!-- Scan Line -->
    <div class="table-scan-line"></div>
  </div>
</div>
